[package]
name = "urmqtt-ws"
description = "MQTT over WebSocket (RFC 6455, MQTT 3.1.1 section 6), the transport only: a bounded HTTP/1.1 Upgrade parser and the frame codec of a server. no_std, no allocation, host-tested; the kernel wires it between TLS and the MQTT parser (ADR-272)."
