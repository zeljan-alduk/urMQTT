[package]
name = "urmqtt-arch"
description = "Architecture facade: one module list (cpu, irq, percpu, time, ipi, msi, paging, trap, barrier, entropy, power, features) over the per-architecture crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
bench = false

[lints]
workspace = true

[features]
# See urmqtt-arch-x86_64: the kernel's memprof build defines the mem symbols.
no-mem-symbols = ["urmqtt-arch-x86_64/no-mem-symbols"]
mem-baseline = ["urmqtt-arch-x86_64/mem-baseline"]

[dependencies]
urmqtt-dispatch = { path = "../dispatch" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
urmqtt-arch-aarch64 = { path = "../arch-aarch64" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
urmqtt-arch-x86_64 = { path = "../arch-x86_64" }
