[package]
name = "urmqtt-nistz256"
description = "P-256 ECDSA and ECDH on the OpenSSL nistz256 assembly: x86_64 (Montgomery 4x64, MULX/ADX), ADR-130, and AArch64 (ARMv8), ADR-255."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
bench = false

[lints]
workspace = true

# Only where the crate is not empty (src/lib.rs): Linux or bare metal.
[target.'cfg(all(target_arch = "x86_64", any(target_os = "linux", target_os = "none")))'.dependencies]
cpufeatures = { version = "0.3", default-features = false }

[target.'cfg(all(any(target_arch = "x86_64", target_arch = "aarch64"), any(target_os = "linux", target_os = "none")))'.dependencies]
zeroize = { version = "1.8", default-features = false }
# The variable-time scalar inversion of verification (ADR-259): already in
# the graph through urmqtt-tls.
p256 = { version = "0.14.0", default-features = false, features = ["arithmetic"] }

[dev-dependencies]
ecdsa = { version = "0.17", default-features = false, features = ["algorithm"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "alloc"] }
rand_chacha = { version = "0.10", default-features = false }
rand_core = { version = "0.10", default-features = false }
