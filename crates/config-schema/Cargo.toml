[package]
name = "urmqtt-config-schema"
description = "Schema, validation and Rust code generation for build-time urMQTT configuration (host-side, used by the config crate's build script)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
bench = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
urmqtt-control = { path = "../control" }
urmqtt-dispatch = { path = "../dispatch" }
# Expiry checks of the embedded certificates (host only: this crate runs
# in build scripts).
x509-cert = { version = "0.3", features = ["pem", "std"] }

[lints]
workspace = true
