[package]
name = "urmqtt-tls"
description = "TLS 1.3 server: rustls handshake followed by a minimal in-house record layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
bench = false

[lints]
workspace = true

[dependencies]
# TLS 1.3 handshake only; the crypto comes from our own provider (ADR-029).
rustls = { version = "=0.23.46", default-features = false }
pki-types = { package = "rustls-pki-types", version = "1.12", default-features = false, features = ["alloc"] }
webpki = { package = "rustls-webpki", version = "0.103.14", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "alloc", "precomputed-tables"] }
# Vendored and patched (ADR-110/111): fixed-base tables without std.
primeorder = { version = "0.14.0", default-features = false, features = ["basepoint-table"] }
curve25519-dalek = { version = "4", default-features = false, features = ["precomputed-tables"] }
sha2 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
hkdf = { version = "0.13", default-features = false }
x509-cert = { version = "0.3", default-features = false }
der = { version = "0.8", default-features = false, features = ["alloc", "oid"] }
rand_core = { version = "0.6", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
zeroize = { version = "1.8", default-features = false }
# Constant-time comparison of secrets (H2).
subtle = { version = "2.6", default-features = false }
urmqtt-sync = { path = "../sync" }

# X25519 on 4x64 limbs: MULX/ADX on x86_64 (ADR-131), mul/umulh on AArch64
# (ADR-259).
[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
urmqtt-x25519 = { path = "../x25519" }

# P-256 on the OpenSSL nistz256 assembly: x86_64 (ADR-130) and AArch64
# (ADR-255), where crates/nistz256 is not empty (Linux and bare metal).
[target.'cfg(all(any(target_arch = "x86_64", target_arch = "aarch64"), any(target_os = "linux", target_os = "none")))'.dependencies]
urmqtt-nistz256 = { path = "../nistz256" }
rfc6979 = { version = "0.6", default-features = false }

[features]
# The sans-IO TLS client, for in-kernel self-tests (dev images only, M17).
client = []
# Per-stage timing of the server's handshakes (host profiling only, never in
# the kernel): crates/tls/src/stages.rs, examples/handshake_profile.rs.
stage-profile = []

[[example]]
name = "handshake_profile"
required-features = ["stage-profile"]

[dev-dependencies]
# The host tests use our own client as well.
urmqtt-tls = { path = ".", features = ["client"] }
# A real rustls client (std) drives our server in the host tests.
rustls = { version = "=0.23.46", default-features = false, features = ["std"] }
