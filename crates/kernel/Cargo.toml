[package]
name = "urmqtt-kernel"
description = "The urMQTT unikernel binary: boot sequence, per-core loop and wiring of all crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "urmqtt"
path = "src/main.rs"
# Host tests cover the parts that compile on the host (cmdline.rs).
test = true
bench = false

[dependencies]
urmqtt-broker = { path = "../broker" }
urmqtt-config.workspace = true
urmqtt-dispatch = { path = "../dispatch" }
urmqtt-mqtt = { path = "../mqtt" }
urmqtt-net = { path = "../net" }
urmqtt-plain = { path = "../plain" }
urmqtt-http = { path = "../http" }
urmqtt-ws = { path = "../ws" }
urmqtt-sntp = { path = "../sntp" }
urmqtt-store = { path = "../store" }
urmqtt-tcp = { path = "../tcp" }

# Only the bare-metal kernel uses these; the host stub links none of them.
[target.'cfg(target_os = "none")'.dependencies]
limine = "0.6.5"
urmqtt-arch = { path = "../arch" }
urmqtt-control = { path = "../control" }
urmqtt-diag = { path = "../diag" }
urmqtt-iommu = { path = "../iommu" }
urmqtt-sync = { path = "../sync" }
urmqtt-log = { path = "../log" }
urmqtt-mm = { path = "../mm" }
urmqtt-pci = { path = "../pci" }
urmqtt-platform = { path = "../platform" }
urmqtt-tls = { path = "../tls" }
urmqtt-usys = { path = "../usys" }
# The drivers the kernel always runs (network, disks, entropy); the others
# come with the virtio-* features below (ADR-257).
urmqtt-virtio = { path = "../virtio", default-features = false, features = ["net", "blk", "scsi", "rng"] }
# test=crypto-bench (dev images only): the same crates the TLS layer uses.
aes-gcm = { version = "0.10", default-features = false, features = ["aes"], optional = true }
chacha20poly1305 = { version = "0.10", default-features = false, optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }

[features]
# The virtio drivers (ADR-257). `virtio-vps`, the default, is the set of the
# MQTT image (make build, universal, template, the builder's template);
# `virtio-all` is every driver that exists, for custom images. virtio-net,
# -blk, -scsi and -rng are always in (the dependency above).
default = ["virtio-vps"]
virtio-vps = ["virtio-gpu", "virtio-console", "virtio-balloon", "virtio-input", "virtio-vsock"]
virtio-all = ["virtio-vps"]
virtio-gpu = ["urmqtt-virtio/gpu"]
virtio-console = ["urmqtt-virtio/console"]
virtio-balloon = ["urmqtt-virtio/balloon"]
virtio-input = ["urmqtt-virtio/input"]
virtio-vsock = ["urmqtt-virtio/vsock"]
# Dev images: in-guest benchmarks and self-tests that need a TLS client.
# Production images are built without it (M17).
# PERF (ADR-200): dev-only memcpy/memmove/memset profile of `test=dp-bench`.
# Defines the three symbols itself: counting wrappers around the arch copies; x86_64.
memprof = ["selftest", "urmqtt-arch/no-mem-symbols", "urmqtt-arch/mem-baseline"]
selftest = ["urmqtt-tls/client", "dep:aes-gcm", "dep:chacha20poly1305", "dep:sha2"]

[lints]
workspace = true
