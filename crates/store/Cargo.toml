[package]
name = "urmqtt-store"
description = "SQLite FFI, raw-disk VFS over virtio-blk, telemetry log and data disk layout."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
links = "sqlite3"

[lib]
bench = false

[features]
# The dbworker's half (ADR-210): compiles the C library for the worker and
# the dispatcher and VFS shim of `worker.rs`.
worker = []
# Host tests only: the store talks to an in-process worker through the same
# protocol the kernel uses.
loopback = []

[lints]
workspace = true

[dependencies]
# GUIDs of raw boot images, derived like scripts/mkraw.py (gpt.rs).
sha2 = { version = "0.11", default-features = false }
aes = { version = "0.9", default-features = false, features = ["zeroize"] }
hmac = { version = "0.13", default-features = false }
zeroize = { version = "1", default-features = false }
cpufeatures = { version = "0.3", default-features = false }
urmqtt-cfg = { path = "../cfg", features = ["alloc"] }
urmqtt-sync = { path = "../sync" }
urmqtt-usys = { path = "../usys" }

[build-dependencies]
# Compiles the vendored SQLite amalgamation (ADR-030).
cc = "1.2"
sha2 = { version = "0.11", default-features = false }
