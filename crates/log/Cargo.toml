[package]
name = "urmqtt-log"
description = "Lock-free per-CPU log rings drained to UART, framebuffer and UDP syslog sinks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
bench = false

[lints]
workspace = true

[dependencies]
font8x8 = { version = "0.3.1", default-features = false }
urmqtt-config = { path = "../config" }
urmqtt-sync = { path = "../sync" }

# Interrupt masking around the sink lock exists only on bare metal.
[target.'cfg(target_os = "none")'.dependencies]
urmqtt-arch = { path = "../arch" }
