[package]
name = "urmqtt-arch-x86_64"
description = "x86_64 support (X1: every facade item exists and fails loudly; the implementations arrive in X2-X8)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
bench = false

[lints]
workspace = true

[features]
# Leave `memcpy`/`memmove`/`memset` undefined: the memprof kernel (ADR-200)
# defines counting ones that call `mem::copy` and `mem::set`.
no-mem-symbols = []
# The pre-ADR-200 `rep movs` code, for the memprof A/B.
mem-baseline = []

[dependencies]
urmqtt-dispatch = { path = "../dispatch" }
urmqtt-sync = { path = "../sync" }

# The refusal message on the framebuffer (`entry.rs`, bare metal only).
[target.'cfg(target_os = "none")'.dependencies]
font8x8 = { version = "0.3.1", default-features = false }
