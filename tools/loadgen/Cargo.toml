[package]
name = "urmqtt-loadgen"
description = "Host-side MQTT/TLS load generator for urMQTT."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "urmqtt-loadgen"
path = "src/main.rs"
test = false
bench = false

[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }

[lints]
workspace = true
