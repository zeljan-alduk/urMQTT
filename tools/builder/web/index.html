<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>urMQTT builder</title>
<meta name="description" content="Configure your own urMQTT image in the browser: options, certificates and keys never leave your computer.">
<link rel="stylesheet" href="app.css?v=__V:app.css__">
<style>
  /* The standalone page: the colours and body of the site it normally sits in. */
  :root { --bg: #f3f4f7; --card: #ffffff; --text: #25253a; --muted: #5d6078; --line: #dcdee8; --row: rgba(47,127,224,.06);
    --blue: #2f7fe0; --link: #2670c8; --btn: #2670c8; --amber: #ffae2b; --ok: #1c7a47; --err: #b42f2f; --band: #2c2c44; color-scheme: light; }
  :root[data-theme="dark"] { --band: #22223a; --bg: #15151f; --card: #1d1d2a; --text: #ecedf5; --muted: #a2a5ba; --line: #2c2d40; --row: rgba(106,168,245,.08); --link: #6aa8f5; --ok: #6fd39c; --err: #ff9c9c; color-scheme: dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) { --band: #22223a; --bg: #15151f; --card: #1d1d2a; --text: #ecedf5; --muted: #a2a5ba; --line: #2c2d40; --row: rgba(106,168,245,.08); --link: #6aa8f5; --ok: #6fd39c; --err: #ff9c9c; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .standalone-band { background: var(--band); color: #f1f2f7; padding: 18px 0; }
  .standalone-band div { max-width: 1160px; margin: 0 auto; padding: 0 20px; font-weight: 700; letter-spacing: .08em; }
</style>
</head>
<body>
  <div class="standalone-band"><div>URMQTT BUILDER (standalone page)</div></div>
  <main>
    <div id="urmqtt-builder" data-lang="en" data-base="./" data-releases="./releases/releases.json">
      <div class="ub ub-wrap" aria-hidden="true">
        <div class="ub-head"><span class="ub-skel" style="height:40px;width:46%;margin-bottom:16px"></span><span class="ub-skel" style="height:22px;width:82%;margin-bottom:10px"></span><span class="ub-skel" style="height:22px;width:58%"></span></div>
        <div class="ub-layout"><div class="ub-main"><span class="ub-skel" style="height:300px"></span><span class="ub-skel" style="height:130px"></span><span class="ub-skel" style="height:100px"></span></div><div class="ub-aside"><span class="ub-skel" style="height:290px"></span></div></div>
      </div>
      <noscript><p style="padding:20px">This page needs JavaScript and WebAssembly.</p></noscript>
    </div>
  </main>
  <div id="ub-live" class="ub-sr" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>
  <script src="app.js?v=__V:app.js__" defer></script>
</body>
</html>
