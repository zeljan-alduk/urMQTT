[package]
name = "urmqtt-builder-wasm"
description = "The urMQTT builder as a WebAssembly module (C1e, ADR-220): packing, validation, the schema, certificate checks, minisign verification and ISO patching, from the same Rust code as the urmqtt-config command line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# cdylib: the .wasm the page loads. rlib: host unit tests and the equality
# test against the command line tool.
crate-type = ["cdylib", "rlib"]
bench = false

[dependencies]
urmqtt-cfg = { path = "../../../crates/cfg", features = ["std"] }
urmqtt-config-schema.workspace = true
urmqtt-config-tool = { path = "../../config" }
urmqtt-control = { path = "../../../crates/control" }
toml = "1.1"

[lints]
workspace = true
