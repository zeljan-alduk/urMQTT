[package]
name = "urmqtt-config-tool"
description = "Host tool for urMQTT configuration blobs: pack a TOML and PEM files into a blob or into a template ISO, show, verify, export the schema (C1, ADR-215, ADR-218)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "urmqtt_config_tool"
path = "src/lib.rs"
bench = false

[[bin]]
name = "urmqtt-config"
path = "src/main.rs"
test = false
bench = false

[dependencies]
urmqtt-cfg = { path = "../../crates/cfg", features = ["std"] }
urmqtt-config-schema.workspace = true
urmqtt-control = { path = "../../crates/control" }
ed25519-dalek = { version = "3.0", default-features = false }
# Release checks (ADR-225): the minisign signature on SHA256SUMS and the sums,
# the same code on the command line and in the browser.
sha2 = { version = "0.11", default-features = false }
base64ct = { version = "1.8", default-features = false, features = ["alloc"] }
# What the page shows about a certificate and its key, and whether they belong
# together (ECDSA P-256 only, like the broker's TLS stack).
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "alloc"] }
x509-cert = { version = "0.3", default-features = false, features = ["pem"] }

[lints]
workspace = true
