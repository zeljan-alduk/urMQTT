# A lab configuration with the Prometheus endpoint switched on (ADR-290): two
# networks may scrape, on a port of its own, with a tighter connection limit.
# Used by the tests of urmqtt-config.
[network]
mode = "static"
address = "192.0.2.10/24"
gateway = "192.0.2.1"

[metrics]
enabled = true
port = 9273
allow_from = ["192.0.2.0/24", "10.8.0.5/32"]
max_connections = 4
request_timeout_s = 3
