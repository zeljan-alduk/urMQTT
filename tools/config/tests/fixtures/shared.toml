# A lab configuration that bounds shared subscriptions (ADR-275,
# configuration format 13): at most 64 $share groups on one data core and 8
# members in one group. Used by the tests of urmqtt-config.
[network]
mode = "static"
address = "192.0.2.10/24"
gateway = "192.0.2.1"

[limits]
max_packet_size = 8192
max_shared_groups = 64
max_shared_group_members = 8
