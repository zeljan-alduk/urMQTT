[package]
name = "urmqtt-disk-tool"
description = "Offline tool for urMQTT boot disks: info, verify, export the database and telemetry, import devices, create images, update the kernel (S1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "urmqtt_disk"
path = "src/lib.rs"
bench = false

[[bin]]
name = "urmqtt-disk"
path = "src/main.rs"
test = false
bench = false

[dependencies]
urmqtt-cfg = { path = "../../crates/cfg", features = ["alloc"] }
urmqtt-store = { path = "../../crates/store" }
# The release signature check of `slots stage --image` (ADR-299): the same code
# as `urmqtt-config check-release` and the builder page.
urmqtt-config-tool = { path = "../config" }

[lints]
workspace = true

[dev-dependencies]
# The A/B tests sign a throwaway release with a key made in the test.
ed25519-dalek = { version = "2.2", default-features = false }
base64ct = { version = "1.8", default-features = false, features = ["alloc"] }
