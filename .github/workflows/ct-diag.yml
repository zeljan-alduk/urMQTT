name: CT diagnosis (ct-dit branch only)

on:
  push:
    branches: [ct-dit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: CT diag (ubuntu-24.04-arm, run ${{ matrix.run }})
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: test
      - name: CPU
        run: |
          lscpu || true
          grep -m1 Features /proc/cpuinfo
          uname -a
      - name: Diagnosis
        run: cargo test --locked --release -p urmqtt-tls --test ct_diag -- --ignored --test-threads=1 --nocapture
      - name: Constant-time tests (H2)
        run: make ct
