name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # Optional: a passwordless minisign secret key (minisign -G -W) in the
      # repository secret MINISIGN_SECRET_KEY signs SHA256SUMS (M17).
      HAS_MINISIGN: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: release
          bare-metal-c: "true"
      - run: make certs
      # Only the dev image is published: prod images embed private keys and are
      # built by the operator from their own deploy/prod/ (docs/DEPLOY.md).
      - name: Install ISO tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xorriso mtools
      - run: make dist ENV=dev
      - name: Sign SHA256SUMS with minisign
        if: env.HAS_MINISIGN == 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          sudo apt-get install -y -qq --no-install-recommends minisign
          key="$RUNNER_TEMP/minisign.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          minisign -S -s "$key" -m build/dist/SHA256SUMS -t "urMQTT $GITHUB_REF_NAME dev $GITHUB_SHA" </dev/null
          rm -f "$key"
      # The SBOM (CycloneDX, scripts/sbom.py) is built by make dist and listed
      # in SHA256SUMS; this binds it to the images as an SBOM attestation next
      # to the provenance below (H9, ADR-190).
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            build/dist/*.elf
            build/dist/*.iso
            build/dist/*.img
          sbom-path: build/dist/urmqtt-dev-${{ github.ref_name }}.cdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/dist/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: build/dist/*
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
