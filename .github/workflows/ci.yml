name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  lint:
    name: Lint (fmt, clippy, typos, actionlint)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: lint
          bare-metal-c: "true"
      - run: make certs
      - name: rustfmt
        run: |
          cargo fmt --all --check
          (cd fuzz && cargo fmt --check)
      - name: clippy (host)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: clippy (aarch64-unknown-none)
        run: |
          cargo clippy --locked -Zbuild-std=core,compiler_builtins,alloc -Zbuild-std-features=compiler-builtins-mem -p urmqtt-kernel --target aarch64-unknown-none -- -D warnings
          cargo clippy --locked -Zbuild-std=core,compiler_builtins,alloc -Zbuild-std-features=compiler-builtins-mem --features selftest -p urmqtt-kernel --target aarch64-unknown-none -- -D warnings
      - name: TCB inventory up to date (docs/audit, AUDIT.md)
        run: python3 scripts/audit-inventory.py --check
      - name: No architecture-specific code outside crates/arch-* (ADR-040)
        run: |
          scripts/check-arch-leaks.sh --self-test
          scripts/check-arch-leaks.sh
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: shellcheck
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_arm64.tar.gz"
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" actionlint
          ./actionlint -shellcheck="$(command -v shellcheck)"
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/kvm-host/*.sh scripts/mirror/*.sh tools/builder/*.sh tools/builder/emulator/*.sh

  test:
    name: Host tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: test
      - name: Install mosquitto clients (MQTT interop tests)
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends mosquitto-clients
          else
            brew install mosquitto
          fi
          mosquitto_pub --help | head -1
      - run: make certs
      - run: cargo test --locked --workspace
      - name: Constant-time tests (H2)
        run: make ct

  builder:
    name: Web builder (WebAssembly module and page)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: builder
      - run: rustup target add wasm32-unknown-unknown
      - run: make certs
      # The module against the command line tool (byte for byte), the form
      # logic, and the page in the runner's headless Chrome (ADR-225..227).
      - run: make builder-test

  kernel:
    name: Kernel (aarch64-unknown-none, ${{ matrix.env }})
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: kernel
          bare-metal-c: "true"
      - run: make certs
      # The release kernel (every ENV but dev) reads no certificate at build
      # time: its configuration is data (ADR-216). Real prod secrets never
      # touch CI.
      - run: make build ENV=${{ matrix.env }}
      - name: Report kernel size
        run: |
          size=$(wc -c < target/aarch64-unknown-none/release/urmqtt)
          echo "### Kernel ELF (${{ matrix.env }}): ${size} bytes" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: urmqtt-kernel-${{ matrix.env }}
          path: target/aarch64-unknown-none/release/urmqtt
          if-no-files-found: error
          retention-days: 14

  repro:
    name: Reproducible prod image (built twice)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: repro
          bare-metal-c: "true"
      - name: Install ISO tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xorriso mtools
      - run: make certs
      - name: Stage throwaway certificates as prod inputs
        run: cp deploy/dev/{ca.pem,server.pem,server.key,control.pub} deploy/prod/
      - name: Build twice and compare
        run: |
          set -o pipefail
          scripts/repro.sh prod | tee -a "$GITHUB_STEP_SUMMARY"

  # The aarch64 suite is about 300 scenarios, far over one job's budget under
  # TCG (no KVM on the runners), so it runs as parallel shards by group
  # (scripts/smoke.sh: SMOKE_ONLY=<group>, SMOKE_GROUPS=<regex of group
  # function names>). Together they cover the former single `make smoke` run:
  #   core      every unguarded scenario of the default run (boot, faults, services,
  #             time, watchdog, crash logs); SMOKE_NO_GROUPS=1 skips the guarded ones
  #   storage-* the disk scenarios (SMOKE_ONLY=storage), in two halves
  #   live      the live-mode scenarios
  #   misc      the other guarded ones (configuration, release kernel, plaintext, storm, attacks, ...)
  #   hardening the H4 scenarios (MTE, ...)
  #   secrecy   H8, the production-image warning and the key-bytes scan
  # NOT in CI yet: the x86_64 and universal-ISO suites (--arch x86_64 and
  # --arch universal, SMOKE_ONLY=diag|install|migrated|config|template|
  # integrity|install-rules|secureboot). They need qemu-system-x86, OVMF
  # (including the Secure Boot build), virt-firmware, osslsigncode and the
  # x86_64 kernel; they are run by hand on the KVM VPS (docs/RELEASE.md).
  smoke:
    name: Smoke ${{ matrix.group }} (QEMU TCG)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            no-groups: "1"
          - group: storage-a
            only: storage
            groups: "^(first_boot|first_boot_crash|scsi_boot|iso_as_cd|own_damaged|storage_topology|layout_v1|grow_online|discard_qcow2)$"
          - group: storage-b
            only: storage
            groups: "^(db_backup|storage_encrypted|backup_upgrade|backup_scheduled|backup_bench|scrub_flip|scrub_load|disk_tool)$"
          - group: live
            only: live
          - group: misc
            only: misc
          - group: hardening
            only: hardening
          - group: secrecy
            only: secrecy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: kernel
          bare-metal-c: "true"
      - name: Install QEMU, UEFI firmware and ISO tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-arm qemu-efi-aarch64 qemu-utils xorriso mtools mosquitto-clients sqlite3
          qemu-system-aarch64 --version | head -1
      - run: make certs
      # The secrecy group also checks a release kernel: build it before
      # `make smoke` rebuilds the dev kernel at the same path.
      - name: Build the release kernel (secrecy group)
        if: matrix.group == 'secrecy'
        run: |
          make build ENV=prod
          cp target/aarch64-unknown-none/release/urmqtt "$RUNNER_TEMP/urmqtt-release.elf"
          echo "SMOKE_RELEASE_KERNEL=$RUNNER_TEMP/urmqtt-release.elf" >> "$GITHUB_ENV"
      - run: make smoke ACCELS=tcg
        env:
          SMOKE_TIMEOUT: "300"
          # Two scenarios assert that no handler is ever reported over its watchdog budget; under TCG on a
          # shared runner a vCPU that is not scheduled for tens of ms breaks that (the same effect as on the
          # VPS in X11). They get three attempts (scripts/smoke.sh, SMOKE_RETRY).
          SMOKE_RETRY: "^(sys-slow-log|log-slow-flood)$"
          # ... and a handler budget of 25 ms instead of 10 for those two (a slow TCG CPU, not a stall).
          SMOKE_HANDLER_BUDGET_MS: "25"
          SMOKE_ONLY: ${{ matrix.only }}
          SMOKE_GROUPS: ${{ matrix.groups }}
          SMOKE_NO_GROUPS: ${{ matrix.no-groups }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-serial-logs-${{ matrix.group }}
          path: build/smoke/*.log*
          if-no-files-found: ignore

  tls:
    name: TLS conformance (tlsfuzzer) and interop
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: kernel
          bare-metal-c: "true"
      - name: Install QEMU, UEFI firmware, ISO tools and TLS libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-arm qemu-efi-aarch64 xorriso mtools \
            python3-venv libssl-dev autoconf automake libtool
      # Ubuntu's libwolfssl-dev (5.6.6) lacks WOLFSSL_TICKET_NONCE_MALLOC and rejects
      # rustls's 32-byte ticket nonce with illegal_parameter; build a pinned release.
      - name: Build wolfSSL (pinned, with WOLFSSL_TICKET_NONCE_MALLOC)
        run: scripts/build-wolfssl.sh
      - run: make certs
      - run: make build
      - name: tlsfuzzer probes
        run: scripts/conformance.sh --accel tcg
      - name: Interop matrix
        shell: bash
        run: |
          set -o pipefail
          scripts/interop.sh --accel tcg | tee -a "$GITHUB_STEP_SUMMARY"

  miri:
    name: Miri (host crates, H5)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: miri
      - name: Install Miri
        run: rustup component add miri
      - name: Miri
        run: scripts/miri.sh

  kani:
    name: Kani proofs (parsers, timer wheel, H5)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    # Four harnesses (mqtt, config), and tcp's parse_any_segment on this runner, are NOT PROVEN
    # (docs/VERIFICATION.md): scripts/kani.sh lists them by name, reports them on every run and
    # fails on any other failure, so this job is a real gate.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: kani
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Kani
        run: scripts/kani.sh

  sanitize:
    name: AddressSanitizer and UBSan (host, SQLite and VFS, H5)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: sanitize
          bare-metal-c: "true"
      - name: Sanitizers
        run: scripts/sanitize.sh

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
      # The fuzz workspace has its own lockfile (advisories only: it is not shipped).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml
          command: check advisories

  supply-chain:
    name: Supply chain (cargo-vet, SBOM)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: supply-chain
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-vet
      # Every dependency is audited, covered by an imported audit or listed as
      # an exemption (docs/SUPPLY-CHAIN.md); --locked fails on stale imports.
      - run: cargo vet --locked
      - name: Exemption list up to date (docs/audit/vet-exemptions.md)
        run: python3 scripts/vet-exemptions.py --check
      - name: SBOM builds and validates, vendored hashes match their files
        run: |
          cargo fetch --locked
          python3 scripts/sbom.py --strict --check

  fuzz-smoke:
    name: Fuzz smoke (60 s per target)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: fuzz
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz
      # The config crate's build script embeds the development certificates.
      - run: make certs
      - name: Run every fuzz target briefly
        run: |
          for t in $(cargo fuzz list); do
            make fuzz T="$t" FUZZ_TIME=60
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
