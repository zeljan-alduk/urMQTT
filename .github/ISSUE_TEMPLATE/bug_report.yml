name: Bug report
description: Something does not build, boot or behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security issues:** please do not file them here; use a private security advisory instead (see SECURITY.md)."
  - type: input
    id: commit
    attributes:
      label: Commit or release
      placeholder: "v0.1.0 or a commit SHA"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Build / make check
        - QEMU (HVF)
        - QEMU (TCG)
        - Cloud VM (ACPI)
        - Host tests / tooling
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, the QEMU command line, client commands.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Serial log
      description: Never paste private keys or production certificates.
      render: text
