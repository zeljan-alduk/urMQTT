name: Feature request
description: Propose a feature or a change to the specification.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you need, and why does the current design not cover it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Mention the effect on attack surface, memory per connection and the milestone plan.
    validations:
      required: true
