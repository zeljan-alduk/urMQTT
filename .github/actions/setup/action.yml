name: Set up urMQTT toolchain
description: Installs the pinned toolchain from rust-toolchain.toml and restores the cargo cache.
inputs:
  cache-key:
    description: Extra key to separate caches between jobs.
    required: false
    default: default
  bare-metal-c:
    description: Install clang and llvm-ar to build the vendored SQLite for aarch64-unknown-none.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      shell: bash
      run: |
        rustup toolchain install
        rustc --version
    - name: Install clang and llvm-ar (SQLite for bare metal, ADR-030)
      if: inputs.bare-metal-c == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends clang llvm
        clang --version | head -1
        llvm-ar --version | head -2
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}
        workspaces: |
          .
          fuzz
