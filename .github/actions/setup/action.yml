name: Set up urMQTT toolchain
description: Installs the pinned toolchain from rust-toolchain.toml and restores the cargo cache.
inputs:
  cache-key:
    description: Extra key to separate caches between jobs.
    required: false
    default: default
runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      shell: bash
      run: |
        rustup toolchain install
        rustc --version
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}
        workspaces: |
          .
          fuzz
