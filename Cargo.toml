[workspace]
resolver = "3"
members = [
    "crates/arch",
    "crates/arch-aarch64",
    "crates/broker",
    "crates/config",
    "crates/config-schema",
    "crates/control",
    "crates/dispatch",
    "crates/kernel",
    "crates/log",
    "crates/mm",
    "crates/mqtt",
    "crates/net",
    "crates/pci",
    "crates/platform",
    "crates/store",
    "crates/sync",
    "crates/tcp",
    "crates/timer-wheel",
    "crates/tls",
    "crates/virtio",
    "tools/control",
    "tools/disk",
    "tools/loadgen",
]
# cargo-fuzz targets need sanitizer flags and live in their own workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.101"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zeljan-alduk/urMQTT"

[workspace.dependencies]
urmqtt-config = { path = "crates/config" }
urmqtt-config-schema = { path = "crates/config-schema" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# RustCrypto backend switches set for the kernel target (.cargo/config.toml).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(aes_armv8)", "cfg(polyval_armv8)", "cfg(chacha20_force_neon)"] }
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

# RustCrypto's CPU feature detection, patched to ask the kernel on bare metal
# (vendor/README.md, ADR-041). Host builds behave as upstream.
[patch.crates-io]
cpufeatures = { path = "vendor/cpufeatures-0.3.1" }
cpufeatures-02 = { package = "cpufeatures", path = "vendor/cpufeatures-0.2.17" }
