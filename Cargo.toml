[workspace]
resolver = "3"
members = [
    "crates/arch",
    "crates/arch-aarch64",
    "crates/arch-x86_64",
    "crates/broker",
    "crates/cfg",
    "crates/config",
    "crates/config-schema",
    "crates/control",
    "crates/diag",
    "crates/dispatch",
    "crates/kernel",
    "crates/log",
    "crates/mm",
    "crates/mqtt",
    "crates/nistz256",
    "crates/net",
    "crates/pci",
    "crates/plain",
    "crates/platform",
    "crates/sntp",
    "crates/store",
    "crates/sync",
    "crates/tcp",
    "crates/timer-wheel",
    "crates/tls",
    "crates/usys",
    "crates/dbworker",
    "crates/virtio",
    "crates/x25519",
    "tools/attack",
    "tools/builder/wasm",
    "tools/config",
    "tools/control",
    "tools/disk",
    "tools/loadgen",
]
# cargo-fuzz targets need sanitizer flags and live in their own workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.101"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zeljan-alduk/urMQTT"

[workspace.dependencies]
urmqtt-cfg = { path = "crates/cfg" }
urmqtt-config = { path = "crates/config" }
urmqtt-config-schema = { path = "crates/config-schema" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# RustCrypto backend switches set for the kernel target (.cargo/config.toml).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(aes_armv8)", "cfg(polyval_armv8)", "cfg(chacha20_force_neon)", "cfg(kani)"] }
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

# The builder page's WebAssembly module (tools/builder, `make builder`): the
# smallest code that is still fast enough to hash a 60 MB image in a browser.
[profile.wasm]
inherits = "release"
opt-level = "s"
strip = true

# RustCrypto's CPU feature detection, patched to ask the kernel on bare metal
# (vendor/README.md, ADR-041). Host builds behave as upstream.
[patch.crates-io]
cpufeatures = { path = "vendor/cpufeatures-0.3.1" }
cpufeatures-02 = { package = "cpufeatures", path = "vendor/cpufeatures-0.2.17" }
# Fixed-base P-256 table without std (ADR-110).
primeorder = { path = "vendor/primeorder-0.14.0" }
