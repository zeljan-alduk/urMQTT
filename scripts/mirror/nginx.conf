# The web server of the release mirror (C1e, ADR-227): it serves
# /var/www/aldotech.io/urmqtt/releases (mounted read-only at /srv/mirror) on a
# loopback port, behind Caddy, which has no rate limit of its own. Caddy strips
# /urmqtt/releases and proxies here, so /v0.2.0/<file> is that release's file and
# /releases.json is the list. Run by urmqtt-mirror-web.service (nginx-unprivileged
# in a container, read-only root, no capabilities).
#
# What it adds to a plain file server:
#   limit_rate     12 MB/s per download (a 63 MB template takes about 5 s), the
#                  first 1 MB at full speed
#   limit_conn     3 downloads at a time per visitor, 12 in all
#   limit_req      the list: 20 requests a minute per visitor (burst 30)
#   only the files the page asks for are served (releases.json, SHA256SUMS, its
#   signature and the template), never the job's own files (.tmp, .lock, meta.json)
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    sendfile on;
    # The root file system is read-only; temporary files go to the tmpfs.
    client_body_temp_path /tmp/c;
    proxy_temp_path /tmp/p;
    fastcgi_temp_path /tmp/f;
    uwsgi_temp_path /tmp/u;
    scgi_temp_path /tmp/s;

    # Caddy is the only client (through the container's bridge); it passes the
    # visitor's address on in X-Forwarded-For, which is what the limits count.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    limit_conn_zone $binary_remote_addr zone=perip:2m;
    limit_conn_zone $server_name zone=total:1m;
    limit_req_zone $binary_remote_addr zone=lists:2m rate=20r/m;
    limit_conn_status 429;
    limit_req_status 429;

    server {
        listen 8080 default_server;
        server_name _;
        root /srv/mirror;
        autoindex off;
        # No file below a dot, and no directory index: only what is listed here.
        location ~ /\. { return 404; }

        location = /releases.json {
            limit_req zone=lists burst=30 nodelay;
            add_header Cache-Control "public, max-age=60";
            try_files $uri =404;
        }

        # The signed sums and their signature: small, and checked again by the page
        # whenever it uses them.
        location ~ ^/[A-Za-z0-9][A-Za-z0-9._-]*/SHA256SUMS(\.minisig)?$ {
            limit_conn perip 6;
            add_header Cache-Control "public, max-age=300, must-revalidate";
            try_files $uri =404;
        }

        # The template: its name carries the version, so a copy never goes stale.
        location ~ ^/[A-Za-z0-9][A-Za-z0-9._-]*/urmqtt-template-[A-Za-z0-9._-]+-universal\.iso$ {
            limit_conn perip 3;
            limit_conn total 12;
            limit_rate_after 1m;
            limit_rate 12m;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / { return 404; }
    }
}
