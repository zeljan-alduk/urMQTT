# Mosquitto configuration for the X11 comparison (docs/PERFORMANCE.md): the
# same mTLS endpoint as the urMQTT production image, as far as Mosquitto can
# express it. Paths are those of the Debian VPS (scripts/x11-mosquitto.sh).
per_listener_settings false
listener 8883
protocol mqtt
cafile /etc/mosquitto/certs/ca.pem
certfile /etc/mosquitto/certs/server.pem
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.3
# urMQTT offers exactly these two (docs/CRYPTO.md); OpenSSL's default would pick
# TLS_AES_256_GCM_SHA384, which costs more per record.
ciphers_tls1.3 TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256
require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file /etc/mosquitto/urmqtt-x11.acl

# RAM only, like the ISO's live mode.
persistence false

max_connections -1
max_inflight_messages 16
max_packet_size 4096
allow_zero_length_clientid false
log_dest stderr
log_type error
log_type warning
connection_messages false
