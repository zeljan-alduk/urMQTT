# Development configuration. Compiled into the ISO by crates/config/build.rs.
# Every key is required; unknown keys are rejected. See README.md, "Configuration".

[network]
mode = "dhcp"                  # "dhcp" | "static" (static needs address + gateway)
mqtt_tls_port = 8883
mqtt_plain_port = 1883         # 0 = disabled; non-zero is only allowed in the dev environment

[tls]
ca = "ca.pem"                  # files are read from deploy/<env>/
cert = "server.pem"
key = "server.key"
identity_field = "cn"          # "cn" | "san_uri"
resumption = true
revocation_list = "revoked.txt"   # generated by make certs

[limits]
max_connections_per_core = 2000000
max_packet_size = 4096
max_topic_len = 256
max_topic_levels = 16
max_subscriptions_per_session = 8
max_inflight_qos1 = 16
max_queued_per_offline_session = 64
max_retained_per_device = 32
max_retained_bytes = 1048576
publish_rate_per_device = "10/s"
handshakes_per_core_per_sec = 2000

[acl]
device_publish = ["devices/{id}/#"]
device_subscribe = ["devices/{id}/cmd/#"]
# Backend identities (exact id or prefix*) with wider rights; no DB lookup.
service_ids = ["backend"]
service_publish = ["devices/+/cmd/#", "fleet/#"]
service_subscribe = ["devices/#", "fleet/#"]
operator_ids = []

[storage]
mode = "auto"
ram_percent = 10
sqlite_heap_mb = 32
telemetry_topics = ["devices/+/telemetry/#"]
retention_days = 30
require_flush = true
require_data_disk = false           # dev: boots without a disk, memory only
refuse_on_corruption = true

[observability]
log_level = "debug"
syslog_udp = ""                # "10.0.0.5:514" for a private collector
metrics_udp = ""               # statsd

[watchdog]
handler_budget_ms = 10
action = "log"                 # "log" | "drop" | "reset"

[memory]
kernel_heap_mb = 32               # power of two; boot-time structures and TLS handshakes
