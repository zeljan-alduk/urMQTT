[package]
name = "urmqtt-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
urmqtt-config-schema = { path = "../crates/config-schema" }
urmqtt-mqtt = { path = "../crates/mqtt" }
urmqtt-platform = { path = "../crates/platform" }
urmqtt-store = { path = "../crates/store" }
urmqtt-tcp = { path = "../crates/tcp" }
urmqtt-net = { path = "../crates/net" }
urmqtt-tls = { path = "../crates/tls" }
urmqtt-broker = { path = "../crates/broker" }
urmqtt-control = { path = "../crates/control" }
urmqtt-arch-aarch64 = { path = "../crates/arch-aarch64" }
# X0b differential targets: the crates the kernel uses, against ring.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false }
sha2_010 = { package = "sha2", version = "0.10", default-features = false }
ring = "0.17"
# The reference record layer and key schedule for diff_tls_record.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
ed25519-dalek = { version = "2.2", default-features = false }

# Standalone workspace: fuzz builds need sanitizer RUSTFLAGS.
[workspace]
members = ["."]

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

