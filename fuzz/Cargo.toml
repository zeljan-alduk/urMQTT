[package]
name = "urmqtt-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
urmqtt-config-schema = { path = "../crates/config-schema" }
urmqtt-mqtt = { path = "../crates/mqtt" }
urmqtt-platform = { path = "../crates/platform" }
urmqtt-store = { path = "../crates/store" }
urmqtt-tcp = { path = "../crates/tcp" }
urmqtt-net = { path = "../crates/net" }
urmqtt-tls = { path = "../crates/tls" }
urmqtt-broker = { path = "../crates/broker" }

# Standalone workspace: fuzz builds need sanitizer RUSTFLAGS.
[workspace]
members = ["."]

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fdt_parse"
path = "fuzz_targets/fdt_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "acpi_parse"
path = "fuzz_targets/acpi_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mqtt_decode"
path = "fuzz_targets/mqtt_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "disk_layout"
path = "fuzz_targets/disk_layout.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tcp_segment"
path = "fuzz_targets/tcp_segment.rs"
test = false
doc = false
bench = false

[[bin]]
name = "net_frame"
path = "fuzz_targets/net_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tls_record"
path = "fuzz_targets/tls_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "x509_identity"
path = "fuzz_targets/x509_identity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "broker_input"
path = "fuzz_targets/broker_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "telemetry_recover"
path = "fuzz_targets/telemetry_recover.rs"
test = false
doc = false
bench = false
