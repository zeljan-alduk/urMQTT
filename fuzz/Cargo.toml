[package]
name = "urmqtt-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
urmqtt-config-schema = { path = "../crates/config-schema" }

# Standalone workspace: fuzz builds need sanitizer RUSTFLAGS.
[workspace]
members = ["."]

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false
