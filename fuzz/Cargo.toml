[package]
name = "urmqtt-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
urmqtt-config-schema = { path = "../crates/config-schema" }
urmqtt-mqtt = { path = "../crates/mqtt" }
urmqtt-platform = { path = "../crates/platform" }
urmqtt-store = { path = "../crates/store" }
urmqtt-tcp = { path = "../crates/tcp" }

# Standalone workspace: fuzz builds need sanitizer RUSTFLAGS.
[workspace]
members = ["."]

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fdt_parse"
path = "fuzz_targets/fdt_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "acpi_parse"
path = "fuzz_targets/acpi_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mqtt_decode"
path = "fuzz_targets/mqtt_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "disk_layout"
path = "fuzz_targets/disk_layout.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tcp_segment"
path = "fuzz_targets/tcp_segment.rs"
test = false
doc = false
bench = false
