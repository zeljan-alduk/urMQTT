[files]
extend-exclude = ["vendor/", "*.pem", "*.key", "Cargo.lock", "fuzz/Cargo.lock", "tools/builder/web/i18n/", "tools/builder/site/products_i18n.py", "tools/builder/demo/i18n/", "tools/builder/site/demo.py"]

[default.extend-words]
# ELF dynamic relocation section names (.rela.dyn)
rela = "rela"
mosquitto = "mosquitto"
Mosquitto = "Mosquitto"
BA = "BA"
INDX = "INDX"
# rustls API names (MessageEncrypter, encrypter())
Encrypter = "Encrypter"
encrypter = "encrypter"
# TCP retransmission timeout
RTO = "RTO"
# x86 Interrupt Stack Table
IST = "IST"
# ARP field names (RFC 826): sender/target hardware and protocol address
tha = "tha"
# CVE Numbering Authority
CNA = "CNA"
