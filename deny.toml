# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

# Advisories fail the build (H9, ADR-192): a RustSec vulnerability, an unsound
# or unmaintained crate anywhere in the graph, or a yanked version is an error.
# The only way past is an entry in `ignore` below with a reason and an expiry
# date, reviewed under docs/VULNERABILITY-HANDLING.md. It is empty on purpose.
# Run by CI on every change and, against a fresh database, by the scheduled
# job .github/workflows/advisories.yml.
[advisories]
version = 2
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "0BSD",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
